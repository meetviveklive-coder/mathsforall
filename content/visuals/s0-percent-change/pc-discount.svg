<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" role="img" aria-label="A ₹800 price with 25% off: ₹200 is cut off and you pay ₹600" style="font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><rect x="20" y="42" width="280" height="34" style="fill:var(--viz-fill,#C2703D);stroke:var(--viz-stroke,#1F2421);stroke-width:1.5"/><rect x="20" y="136" width="210" height="34" style="fill:var(--viz-fill,#C2703D);stroke:var(--viz-stroke,#1F2421);stroke-width:1.5"/><rect x="230" y="136" width="70" height="34" style="fill:var(--viz-empty,#FFFFFF);stroke:var(--viz-muted,#8A938D);stroke-width:1.8;stroke-dasharray:5 4"/><text x="20" y="35" font-size="14" text-anchor="start" font-weight="700" style="fill:var(--viz-text,#1F2421)">Before: ₹800</text><text x="114.9" y="94" font-size="14" text-anchor="start" font-weight="600" style="fill:var(--viz-text,#1F2421)">100% = ₹800</text><text x="20" y="129" font-size="14" text-anchor="start" font-weight="700" style="fill:var(--viz-text,#1F2421)">Sale: 25% off</text><text x="75.8" y="188" font-size="14" text-anchor="start" font-weight="600" style="fill:var(--viz-text,#1F2421)">You pay ₹600</text><text x="224" y="188" font-size="14" text-anchor="start" font-weight="600" style="fill:var(--viz-text,#1F2421)">25% = ₹200</text></svg>
