<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-label="Yellow and red paint in the ratio 2 to 3, as one bar of 5 equal parts" style="font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="160" y="30" font-size="15" text-anchor="middle" font-weight="700" style="fill:var(--viz-point,#2F6F62)">5 equal parts in all</text><rect class="blk r0" x="20" y="46" width="56" height="44" style="fill:var(--viz-fill,#C2703D);stroke:var(--viz-stroke,#1F2421);stroke-width:1.5"/><rect class="blk r0" x="76" y="46" width="56" height="44" style="fill:var(--viz-fill,#C2703D);stroke:var(--viz-stroke,#1F2421);stroke-width:1.5"/><path d="M23,96 L23,100 L129,100 L129,96" style="fill:none;stroke:var(--viz-text,#1F2421);stroke-width:1.5"/><text class="lab r0" x="76" y="120" font-size="15" text-anchor="middle" font-weight="700" style="fill:var(--viz-text,#1F2421)">Yellow</text><text class="grp g0" x="76" y="140" font-size="14" text-anchor="middle" font-weight="400" style="fill:var(--viz-text,#1F2421)">2 parts</text><rect class="blk r1" x="132" y="46" width="56" height="44" style="fill:var(--viz-empty,#FFFFFF);stroke:var(--viz-stroke,#1F2421);stroke-width:1.5"/><rect class="blk r1" x="188" y="46" width="56" height="44" style="fill:var(--viz-empty,#FFFFFF);stroke:var(--viz-stroke,#1F2421);stroke-width:1.5"/><rect class="blk r1" x="244" y="46" width="56" height="44" style="fill:var(--viz-empty,#FFFFFF);stroke:var(--viz-stroke,#1F2421);stroke-width:1.5"/><path d="M135,96 L135,100 L297,100 L297,96" style="fill:none;stroke:var(--viz-text,#1F2421);stroke-width:1.5"/><text class="lab r1" x="216" y="120" font-size="15" text-anchor="middle" font-weight="700" style="fill:var(--viz-text,#1F2421)">Red</text><text class="grp g1" x="216" y="140" font-size="14" text-anchor="middle" font-weight="400" style="fill:var(--viz-text,#1F2421)">3 parts</text></svg>
